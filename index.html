<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GS">
<meta name="app-version" content="2026.11.26-22">
<meta name="theme-color" content="#1c1016">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>GS</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="lib/fonts.css">
<style>
/*
VOICE: ruhig und persönlich, wie ein eigenes Notizbuch voller Lieblingsorte
IDEA: eine Landkarte ganz ohne Beschriftung, auf die man Fotos pinnt
PICTURE: die randlose Karte selbst, Fotopins als runde Stecknadeln mit weißem Rand
COLOUR/TYPE: Nacht in Pflaume und Wein, Koralle als Akzent, Kerzenlicht für Sterne; Fraunces kursiv für Überschriften, DM Sans für alles andere (wie Startseite)
LAYOUT: Vollbildkarte, schwebende Knöpfe unten rechts, alles andere in Bottom-Sheets
*/
:root{--nacht:#1c1016;--wein:#6b2440;--haut:#f6e9e4;--sug:#7b8f6a;--bg:#241520;--ink:#f6e9e4;--mut:#b89aa8;--line:#3d2836;--chip:rgba(36,21,32,.86);--acc:#f2542d;--gold:#ffb46b;--field:#311d2b;--sh:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
.serif,h2,#setup h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:300;letter-spacing:-.01em}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{height:100%;min-height:var(--appH,100%);overflow:hidden;background:#22141d}
body{margin:0;position:relative;height:100%;height:var(--appH,100%);overflow:hidden;background:#22141d;--sb:max(env(safe-area-inset-bottom),22px)}
body{font:16px/1.5 'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:absolute;inset:0;z-index:0;background:#22141d}
body[data-mapstyle=abend] #map{background:#22141d}
body[data-mapstyle=nacht] #map{background:#1e2827}
body[data-mapstyle=schlicht] #map{background:#f5f3f0}body[data-mapstyle=natur] #map{background:#f6f1e4}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:absolute;top:calc(env(safe-area-inset-top) + 30px);left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;z-index:500;pointer-events:none}
.top>*{pointer-events:auto}
.topfade{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 18px);background:linear-gradient(var(--fade,#22141d),transparent);opacity:.85;z-index:450;pointer-events:none}
.chip{background:var(--chip);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;box-shadow:var(--sh);height:44px;padding:0 16px;display:flex;align-items:center;gap:9px;border:0;font-weight:700;white-space:nowrap}
.chip.ic{width:44px;padding:0;justify-content:center}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#9aa0a8}.dot.ok{background:#22c55e}.dot.off{background:#f59e0b}.dot.err{background:#ef4444}
.fabs{position:absolute;right:14px;bottom:calc(var(--sb) + 14px);display:flex;flex-direction:column;gap:10px;z-index:500;align-items:center}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--chip);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh);display:grid;place-items:center}
.fab.main{width:64px;height:64px;background:var(--acc);color:#fff}
.fab.main svg{width:28px;height:28px;stroke-width:2.4}
.leaflet-control-attribution{font:10px/1.4 'DM Sans',sans-serif!important;background:rgba(28,16,22,.6)!important;color:#b89aa8!important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#e3cfd6!important}
.leaflet-bottom.leaflet-left{margin-bottom:calc(var(--sb) - 6px)}

.pin{background:none;border:0}
.pin-b{position:relative;width:48px;height:48px;border-radius:50%;background:var(--acc);border:3px solid var(--haut);box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 18px rgba(242,84,45,.35);display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.pin-b img,.leaflet-container .leaflet-marker-pane .pin-b img{width:42px!important;height:42px!important;max-width:42px!important;max-height:42px!important;border-radius:50%;object-fit:cover;display:block}
.pin-b::after{content:'';position:absolute;left:50%;top:100%;margin-top:-1px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--haut)}
.me{width:18px;height:18px;border-radius:50%;background:#2f80ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,128,255,.22)}

#cross{position:absolute;left:50%;top:50%;width:48px;height:58px;margin:-58px 0 0 -24px;z-index:600;pointer-events:none;display:none}
#placeHint{position:absolute;top:calc(env(safe-area-inset-top) + 30px);left:50%;transform:translateX(-50%);z-index:600;display:none;font-weight:500}
#placeBar{position:absolute;left:14px;right:14px;bottom:calc(var(--sb) + 14px);z-index:600;display:none;gap:10px;max-width:520px;margin:0 auto}
#placeBar .btn{flex:1;box-shadow:var(--sh)}
body.placing #cross,body.placing #placeHint{display:block}
body.placing #placeBar{display:flex}
body.placing .fabs,body.placing .top{display:none}

.scrim{position:absolute;inset:0;background:rgba(20,8,14,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:900}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--bg) radial-gradient(120% 60% at 90% 0%,rgba(107,36,64,.35),transparent 70%) no-repeat;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 20px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.x{position:absolute;right:10px;top:8px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--mut)}
h2{font-size:30px;line-height:1.08;margin:6px 48px 16px 0;text-wrap:balance}
h3{font-size:16px;margin:22px 0 8px}
.mut{color:var(--mut)}.small{font-size:14px}
p{margin:0 0 10px}

.btn{min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:700;background:var(--field);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--acc);color:#fff}
.btn.danger{color:#ff7a7f}
.btn.wide{width:100%;margin-top:8px}
.btn:focus-visible,.fab:focus-visible,.chip:focus-visible,.choice:focus-visible,.item:focus-visible,.st:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row-btns{display:flex;gap:10px;margin-top:18px}.row-btns .btn{flex:1}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:700;padding:10px 0;min-height:44px}

.form label{display:block;font-size:14px;font-weight:500;color:var(--mut);margin-bottom:12px}
input,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{border-color:var(--acc)}
.addrrow{display:flex;gap:8px;align-items:flex-end}.addrrow label{flex:1;margin:0}
.addrrow .btn{width:48px;padding:0;flex:none;margin-bottom:0}
.photo{display:flex!important;align-items:center;gap:16px;margin-bottom:16px!important}
.photo .t{font-weight:700;color:var(--acc);font-size:16px}
.photo input{display:none}

.av{width:84px;height:84px;border-radius:50%;flex:none;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:28px;overflow:hidden;border:3px solid var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:46px;height:46px;font-size:16px;border-width:2px}
.av.ph{background:var(--field);color:var(--mut);box-shadow:none;border:2px dashed var(--line)}

.stars{display:inline-flex;gap:1px;flex:none}
.st{width:24px;height:24px;padding:0;border:0;background:none;color:var(--line);display:inline-grid;place-items:center}
.st svg{width:100%;height:100%;fill:currentColor}
.st.on{color:var(--gold)}
.st .hs{fill:url(#halfStar)}
.st.half svg{fill:url(#halfStar)}
.ste{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;padding:4px;color:var(--line)}
.ste svg{width:100%;height:100%;fill:currentColor;pointer-events:none}
.ste.on{color:var(--gold)}.ste.half svg{fill:url(#halfStar)}
.ste button{position:absolute;top:0;bottom:0;width:50%;border:0;background:none;padding:0}
.ste button:first-child{left:0}.ste button:last-child{right:0}
.ste button:focus-visible{outline:3px solid var(--acc);outline-offset:-2px;border-radius:8px}
.form .st{width:42px;height:42px;padding:5px}
.rate{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rate>span:first-child{font-weight:500}
.rate .n{font-variant-numeric:tabular-nums;color:var(--mut);width:2.8em;text-align:right;white-space:nowrap}
.rate .r{display:flex;align-items:center;gap:6px}

.head{display:flex;gap:16px;align-items:center;margin:6px 44px 4px 0}
.head h2{margin:0 0 2px}
.addr{color:var(--mut);margin:0;font-size:15px}
.score{display:flex;align-items:center;gap:14px;margin:18px 0 10px;padding:14px 16px;border-radius:16px;background:var(--field)}
.score b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.score .st{width:28px;height:28px}
.score small{display:block;color:var(--mut);font-size:14px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}
.ext{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;text-decoration:none;min-height:44px}

.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:16px;background:var(--field);margin-bottom:10px;text-align:left;font-weight:700}
.choice small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.choice .c{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.searchrow{display:flex;gap:8px;align-items:center}.searchrow input{margin:0}.searchrow .btn{flex:none}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:56px}
div.item{padding:0;gap:4px}
.item-main{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 0;min-height:56px}
.pinbtn{flex:none;width:44px;height:44px;border:0;background:none;color:var(--line);display:grid;place-items:center;border-radius:12px}
.pinbtn svg{width:20px;height:20px}
.pinbtn.on{color:var(--acc)}.pinbtn.on svg{fill:currentColor}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 6px}
.sec h3{margin:0}
.sec .mut{font-size:14px}
.favs .item:first-child{border-top:0}
.hint{color:var(--mut);font-size:14px;background:var(--field);border-radius:14px;padding:12px 14px;margin:4px 0 0}
.searchrow2{display:flex;gap:8px;align-items:center;margin:18px 0 0;position:relative}
.searchrow2 .searchbox{flex:1;margin:0}
.sortbtn{flex:none;position:relative;width:48px;height:48px;border-radius:12px;border:0;background:var(--field);display:grid;place-items:center;color:var(--ink)}
.sortbtn.act{background:var(--acc);color:#fff}
.sortbtn .bd{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.sortmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:min(290px,100%);background:var(--bg);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);border:1px solid var(--line);padding:6px;display:none}
.sortmenu.on{display:block}
.sortmenu .mh{font-size:13px;color:var(--mut);padding:8px 10px 4px;font-weight:500}
.sopt{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;background:none;border-radius:10px;padding:0 10px;text-align:left;font-weight:500}
.sopt:active{background:var(--field)}
.sopt .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:#fff}
.sopt.on .ck{background:var(--acc);border-color:var(--acc)}
.sopt .lb{flex:1}
.sopt small{color:var(--mut);font-size:13px;font-weight:400}
.sortmenu .reset{width:100%;border:0;background:none;color:var(--acc);font-weight:700;min-height:42px;border-top:1px solid var(--line);margin-top:4px}
.sortinfo{font-size:13px;color:var(--mut);font-weight:400}
.searchbox{position:relative;margin:18px 0 0}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);width:20px;height:20px}
.searchbox input{margin:0;padding-left:40px}
.more{width:100%;margin-top:8px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--mut);cursor:pointer;min-height:44px}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog .sw{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tog .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--haut);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog input:checked+.sw{background:var(--sug)}
.tog input:checked+.sw::after{transform:translateX(16px)}
.tog input:focus-visible+.sw{outline:3px solid var(--acc);outline-offset:2px}
.sico{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--sug);color:#fff;font-weight:700;font-size:17px;border:2px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sico svg{width:22px;height:22px;stroke:#fff}
.dist{flex:none;font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;white-space:nowrap}
.sugpin .pin-b{width:38px;height:38px;background:var(--sug);font-size:14px}
.sugpin .pin-b svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sugpin .pin-b::after{border-left-width:6px;border-right-width:6px;border-top-width:8px}
.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.nav a.btn{text-decoration:none;color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.modes .btn{font-weight:500;padding:0 6px;font-size:15px}
#routeBar{position:absolute;left:12px;right:84px;bottom:calc(var(--sb) + 14px);z-index:520;display:none;align-items:center;gap:10px;background:var(--chip);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:18px;box-shadow:var(--sh);padding:8px 8px 8px 14px;max-width:420px}
#routeBar.on{display:flex}
#routeBar .rt{flex:1;min-width:0;line-height:1.25}
#routeBar .rt b{display:block;font-size:17px;white-space:nowrap}
#routeBar .rt small{color:var(--mut);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#routeBar .btn{min-height:40px;padding:0 12px;font-size:14px}
#routeBar .x2{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--mut);flex:none}
body.placing #routeBar{display:none}
.item .t{flex:1}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .t small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{width:15px;height:15px}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg .btn{padding:0 8px}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 86px);transform:translate(-50%,-10px);background:var(--haut);color:var(--nacht);font-weight:500;padding:10px 16px;border-radius:12px;font-size:15px;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

#setup{position:absolute;inset:0;z-index:2000;background:radial-gradient(120% 70% at 80% 0%,#4a1f36 0%,#2b1424 45%,#1c1016 80%);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 28px);display:none}
body.needs-setup #setup{display:block}
#setup .wrap{max-width:520px;margin:0 auto}
#setup h1{font-size:44px;line-height:1.02;margin:8px 0 10px}
#setup .marke{font-weight:700;letter-spacing:.02em;font-size:18px;margin:0 0 4px}
#setup .art{display:block;width:100%;height:auto;margin:0 0 10px}
#setup ol{padding-left:20px;margin:6px 0 14px;color:var(--mut)}

.err{color:#ff7a7f;font-weight:500;min-height:1.5em;margin-top:10px}
.form label.chk{display:flex;gap:12px;align-items:flex-start;color:var(--ink);font-size:15px;font-weight:400}
.chk a{color:var(--acc)}
.chk input{width:22px;height:22px;flex:none;margin:1px 0 0;padding:0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--acc)}
.chk input[type=radio]{-webkit-appearance:radio}
.top .rgt{display:flex;gap:8px}
.chip.on{background:var(--acc);color:#fff}
.pub-b{width:38px;height:38px;border-radius:50%;background:var(--wein);color:var(--haut);border:3px solid var(--haut);box-shadow:0 3px 10px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pub-b svg{width:18px;height:18px}
.av.pubav{background:var(--wein)}.av.pubav svg{width:40px;height:40px}
.av.xs{width:36px;height:36px;font-size:14px;border-width:2px;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--field);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;margin:10px 0 0}
.badge svg{width:16px;height:16px}
.form label.chk.pubchk{background:var(--field);border-radius:14px;padding:12px 14px;margin:16px 0 4px}
.rev{border-top:1px solid var(--line);padding:12px 0 4px}
.rev-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rev .who{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;font-weight:700;text-align:left;min-height:44px;color:inherit}
.rev .who small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.rev .st{width:18px;height:18px}
.rev-t{display:block;margin-top:6px}
.rev-r{margin:4px 0 0}
.rev-m{color:var(--mut);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.rev-m svg,.ort-m svg{width:16px;height:16px}
#setupSwitch{margin-top:4px;text-align:center}
.choice .av.s{border-width:0}
.inrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}.inrow label{flex:1;margin:0!important}.inrow .btn{flex:none}
.tagx{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--field);color:var(--mut);vertical-align:1px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="halfStar" x1="0" x2="1" y1="0" y2="0"><stop offset="50%" stop-color="#f5b301"/><stop offset="50%" stop-color="#d9d6cf"/></linearGradient></defs></svg>
<div id="map"></div>
<div class="topfade"></div>

<div class="top">
  <button class="chip" data-act="list" aria-label="Alle Spots anzeigen"><span class="dot" id="dot"></span><span id="stxt">Spots</span></button>

function stars(key, val, editable) {
  val = clampR(val);

  for (let i = 1; i <= 5; i++) {
    const cls = val >= 2 * i ? ' on' : val === 2 * i - 1 ? ' half' : '';
    out += editable
      ? `<span class="ste${cls}">${STAR}<button type="button" data-star="${key}" data-v="${2 * i - 1}" aria-label="${2 * i - 1} von 10"></button><button type="button" data-star="${key}" data-v="${2 * i}" aria-label="${2 * i} von 10"></button></span>`
      : `<span class="st${cls}">${STAR}</span>`;
  }

}

/* ---------- iOS-26-Fix: App exakt so hoch wie der Bildschirm ---------- */
function fitScreen() {
  // Als Home-Bildschirm-App gehört der App der ganze Bildschirm; iOS 26 meldet die Höhe aber falsch.
  if (!navigator.standalone || !screen.width || !screen.height) return;
  const long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
  const h = window.innerWidth > window.innerHeight ? short : long;
  document.documentElement.style.setProperty('--appH', h + 'px');
  if (map) map.invalidateSize({ pan: false });
}
window.addEventListener('resize', fitScreen);

function treeImage(col) {
  const s = 32, r = (window.devicePixelRatio || 1) > 1 ? 2 : 1, c = document.createElement('canvas');
  c.width = c.height = s * r; const g = c.getContext('2d'); g.scale(r, r);
  for (const [x, y, rad] of [[6, 7, 3.2], [20, 5, 2.6], [27, 17, 3], [13, 19, 3.4], [4, 27, 2.4], [22, 28, 2.2]]) {
    g.globalAlpha = 0.55; g.fillStyle = col; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
    g.globalAlpha = 0.35; g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x - rad * 0.35, y - rad * 0.35, rad * 0.4, 0, 7); g.fill();
  }
  return { data: g.getImageData(0, 0, s * r, s * r), ratio: r };
}
function wireImages(gl) {
  if (!gl || gl._spotsImg) return; gl._spotsImg = true;
  gl.on('styleimagemissing', e => {
    if (!/^trees-[0-9a-f]{6}$/.test(e.id) || gl.hasImage(e.id)) return;
    const t = treeImage('#' + e.id.slice(6)); gl.addImage(e.id, t.data, { pixelRatio: t.ratio });
  });
  /* Waldparkplätze: Parkplätze, die im oder direkt am Wald liegen, bekommen ein grünes P */
  let sig = '';
  gl.on('idle', () => {
    try {
      const src = gl.getSource('forestpark');
      if (!src || !gl.getLayer('parking')) return;
      const out = [], seen = new Set();
      if (gl.getZoom() >= 14) for (const f of gl.queryRenderedFeatures({ layers: ['parking'] })) {
        const c = f.geometry && f.geometry.coordinates; if (!c) continue;
        const k = c[0].toFixed(5) + ',' + c[1].toFixed(5); if (seen.has(k)) continue; seen.add(k);
        const p = gl.project(c);
        if (gl.queryRenderedFeatures([[p.x - 14, p.y - 14], [p.x + 14, p.y + 14]], { layers: ['wood'] }).length) out.push({ type: 'Feature', geometry: { type: 'Point', coordinates: c }, properties: {} });
      }
      const s = [...out.map(f => f.geometry.coordinates.join())].sort().join('|');
      if (s !== sig) { sig = s; src.setData({ type: 'FeatureCollection', features: out }); }
    } catch {}
  });
}
async function loadStyle(k) {
  if (STYLES[k].pal) return buildStyle(PAL[STYLES[k].pal]);
  if (!styleCache[k]) {
    const r = await fetch(OFM + STYLES[k].ofm);
    if (!r.ok) throw new Error('Kartenstil nicht erreichbar');
    const st = await r.json();
    st.layers = (st.layers || []).filter(l => l.type !== 'symbol'); // alle Beschriftungen & Symbole raus
    styleCache[k] = JSON.stringify(st);
  }
  return JSON.parse(styleCache[k]);
}
const STYLE_BG = { abend: '#22141d', natur: '#f6f1e4', nacht: '#1e2827', schlicht: '#f5f3f0' };
async function setStyle(k) {
  if (!STYLES[k]) k = 'abend';
  document.body.dataset.mapstyle = k; LS.set('spots.style', k);
  document.documentElement.style.background = document.body.style.background = STYLE_BG[k];
  document.body.style.setProperty('--fade', STYLE_BG[k]);
  const req = ++styleReq;
  let layer = null;
  try {
    if (typeof maplibregl === 'undefined' || !L.maplibreGL) throw new Error('kein MapLibre');
    const st = await loadStyle(k);
    if (req !== styleReq) return;
    layer = L.maplibreGL({ style: st, attribution: ATTR, attributionControl: false });
    if (tiles) map.removeLayer(tiles);
    tiles = layer.addTo(map);
    wireImages(layer.getMaplibreMap && layer.getMaplibreMap());
  } catch (e) {
    if (req !== styleReq) return;
    if (layer && map.hasLayer(layer)) map.removeLayer(layer);
    // Keine fremde Ersatzkarte: Stil aus dem Netz nicht erreichbar → eigener Stil „Abend“; sonst Hinweis und später neu versuchen
    if (!STYLES[k].pal && typeof maplibregl !== 'undefined' && L.maplibreGL) {
      try { layer = L.maplibreGL({ style: buildStyle(PAL.abend), attribution: ATTR, attributionControl: false }); if (tiles) map.removeLayer(tiles); tiles = layer.addTo(map); wireImages(layer.getMaplibreMap && layer.getMaplibreMap()); return; } catch {}
    }

    setTimeout(() => { if (req === styleReq) setStyle(document.body.dataset.mapstyle); }, 15000);
  }
}

function locate() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Standort ist auf diesem Gerät nicht verfügbar.'));
    navigator.geolocation.getCurrentPosition(
      p => res([p.coords.latitude, p.coords.longitude]),
      e => rej(new Error(e.code === 1 ? 'Standortzugriff verweigert – in Einstellungen › Datenschutz › Ortungsdienste erlauben.' : 'Standort konnte nicht ermittelt werden.')),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}

/* ---------- Geocoding (OpenStreetMap Nominatim) ---------- */
function fmtAddr(j) {
  const a = (j && j.address) || {};
  const street = [a.road || a.pedestrian || a.footway || a.path || a.square || a.cycleway, a.house_number].filter(Boolean).join(' ');
  const city = [a.postcode, a.city || a.town || a.village || a.municipality || a.suburb || a.county].filter(Boolean).join(' ');
  const first = street || (j && j.name) || '';
  return [first, city].filter(Boolean).join(', ') || (j && j.display_name) || '';
}
async function reverseGeo(lat, lng) {
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=de`);
  if (!r.ok) throw new Error('Adressdienst nicht erreichbar');
  return fmtAddr(await r.json());
}
async function searchGeo(q) {
  let u = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=de&q=${encodeURIComponent(q)}`;
  if (map.getZoom() >= 8) { const b = map.getBounds(); u += `&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`; }
  const r = await fetch(u);
  if (!r.ok) throw new Error('Adressdienst nicht erreichbar');
  const j = await r.json();
  return Array.isArray(j) ? j.filter(x => isFinite(+x.lat) && isFinite(+x.lon)) : [];
}

/* Sortierung: mehrere Kriterien, Reihenfolge = Priorität; nichts gewählt = A–Z */
const SORTS = {
  g: { label: 'Gesamtbewertung', sub: 'beste zuerst' },
  a: { label: 'Ambiente', sub: 'beste zuerst' },
  u: { label: 'Ungestört', sub: 'beste zuerst' },
  new: { label: 'Neueste zuerst', sub: 'zuletzt hinzugefügt oben' },
  old: { label: 'Älteste zuerst', sub: 'zuerst hinzugefügt oben' }
};
let sortSel = (LS.get('spots.sort', ['g']) || []).filter(k => SORTS[k]);
const tsOf = p => { try { return p.createdAt && p.createdAt.toMillis ? p.createdAt.toMillis() : Date.now(); } catch { return Date.now(); } };
function sortedPins() {
  const cmp = {
    g: (a, b) => clampR(b.r.g) - clampR(a.r.g), a: (a, b) => clampR(b.r.a) - clampR(a.r.a), u: (a, b) => clampR(b.r.u) - clampR(a.r.u),
    new: (a, b) => tsOf(b) - tsOf(a), old: (a, b) => tsOf(a) - tsOf(b)
  };
  return [...pins.values()].sort((a, b) => {
    for (const k of sortSel) { const d = cmp[k](a, b); if (d) return d; }
    return String(a.name).localeCompare(String(b.name), 'de');
  });
}
const rowKey = () => sortSel.find(k => k === 'g' || k === 'a' || k === 'u') || 'g';
function toggleSort(k) {
  if (!SORTS[k]) return;
  if (sortSel.includes(k)) sortSel = sortSel.filter(x => x !== k);
  else { if (k === 'new' || k === 'old') sortSel = sortSel.filter(x => x !== 'new' && x !== 'old'); sortSel.push(k); }
  LS.set('spots.sort', sortSel);
  renderSortUi(true);
}
function sortMenuHtml() {
  return `<div class="mh">Sortieren nach (Reihenfolge = Priorität)</div>` +
    Object.entries(SORTS).map(([k, s]) => { const i = sortSel.indexOf(k); return `<button class="sopt${i >= 0 ? ' on' : ''}" data-act="sort" data-k="${k}" aria-pressed="${i >= 0}"><span class="ck">${i >= 0 ? i + 1 : ''}</span><span class="lb">${s.label}<br><small>${s.sub}</small></span></button>`; }).join('') +
    `<button class="reset" data-act="sort-reset">${sortSel.length ? 'Zurücksetzen (A–Z)' : 'Alphabetisch (A–Z) aktiv'}</button>`;
}
const sortInfo = () => sortSel.length ? sortSel.map(k => SORTS[k].label.replace(' zuerst', '')).join(' › ') : 'A–Z';
function renderSortUi(keepOpen) {
  const b = $('#sortBtn'); if (!b) return;
  b.classList.toggle('act', sortSel.length > 0);
  b.innerHTML = ico('sort') + (sortSel.length ? `<span class="bd">${sortSel.length}</span>` : '');
  const m = $('#sortMenu'); if (m) { m.innerHTML = sortMenuHtml(); if (!keepOpen) m.classList.remove('on'); }
  const s = $('#sortInfo'); if (s) s.textContent = sortInfo();
  listLimit = LIST_STEP;
  const el = $('#lres'); if (el) el.innerHTML = listBodyHtml();
}
const favPins = () => [...pins.values()].filter(p => p.fav > 0).sort((a, b) => a.fav - b.fav);
function filteredPins() {

async function toThumb(file) {

  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden')); i.src = url; });

    c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, S, S);

async function connect() {

    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A, F, Au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);

const CONSENT_VERSION = '2026-11-26';

async function checkInvite(code) {

  const { F } = fs;
  let snap, link = null;
  try {
    snap = await F.getDocFromServer(F.doc(fs.db, 'einladungen', code));

  } catch (e) { throw new Error(e && e.code === 'unavailable' ? 'Keine Internetverbindung.' : 'Der Code konnte nicht geprüft werden: ' + errHint(e)); }

    if (snap.data().usedBy) throw new Error('Dieser Einladungscode wurde schon benutzt.');
    return { type: 'zugang' };
  }
  if (!link || !link.exists()) throw new Error('Diesen Code gibt es nicht.');
  const d = link.data() || {};
  if (d.usedBy) throw new Error('Dieser Code wurde schon benutzt.');

  const { F, db } = fs, ts = F.serverTimestamp();
  b.set(F.doc(db, 'karten', info.karte, 'mitglieder', uid), { uid, name: name.slice(0, 40), rolle: 'member', via: code, joinedAt: ts });
  b.update(F.doc(db, 'kartenEinladungen', code), { usedBy: uid, usedAt: ts });

    b.set(F.doc(db, 'nutzer', uid), { name, bio: '', photo: '', code, einwilligung: consentData(), createdAt: ts, updatedAt: ts });

const msOf = t => { try { return t && t.toMillis ? t.toMillis() : Date.now(); } catch { return Date.now(); } };
function stopKarten() {

let kartenRetry = 0;
function watchKarten(user) {

function listenKarten(user) {

    kartenRetry = 0;

    if (snap.metadata.fromCache && !karten.length) return; // erst entscheiden, wenn der Server geantwortet hat
    kartenKnown = true;
    if (!karten.some(k => k.id === curKid)) {

      else { stopSync(); curKid = ''; curKarte = null; if (karteUnsub) { karteUnsub(); karteUnsub = null; } setStatus('Keine Karte', 'off'); maybeOnboard(); }

    console.warn('Karten', e);

    const wait = Math.min(30000, 3000 * 2 ** kartenRetry++);

async function checkUpdate(manual) {
  try {
    const r = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
    if (m && m[1] !== APP_VERSION) {
      let tries = 0; try { tries = +sessionStorage.getItem('spots.upd.' + m[1]) || 0; sessionStorage.setItem('spots.upd.' + m[1], tries + 1); } catch {}
      if (tries < 2) { updatePending = m[1]; applyUpdate(); return; }
    }
    if (manual) toast('Die App ist aktuell');
  } catch { if (manual) toast('Keine Verbindung'); }
}
function applyUpdate() {
  if (!updatePending || ['form', 'pedit', 'delacc', 'karte', 'karten', 'onboard'].includes(mode) || placing) return; // nie mitten im Bearbeiten neu laden
  toast('Neue Version wird geladen…');

  setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(v)), 700);
}
function onSnap(snap) {
  if (curKid) pinFails[curKid] = 0;
  const seen = new Set();
  snap.forEach(d => {
    const x = d.data() || {};
    if (!finite(x.lat) || !finite(x.lng)) return;
    const p = { id: d.id, name: String(x.name || 'Ohne Namen').slice(0, 80), desc: String(x.desc || '').slice(0, 1000), address: String(x.address || '').slice(0, 200), lat: x.lat, lng: x.lng, photo: okPhoto(x.photo) ? x.photo : '', r: (() => { const rr = x.r || {}, sc = x.rs === 10 ? 1 : 2; return { g: clampR((Number(rr.g) || 0) * sc), a: clampR((Number(rr.a) || 0) * sc), u: clampR((Number(rr.u) || 0) * sc) }; })(), fav: Number(x.fav) || 0, pub: typeof x.pub === 'string' ? x.pub.slice(0, 80) : '', createdAt: x.createdAt, updatedAt: x.updatedAt };
    seen.add(d.id); pins.set(d.id, p); upsertMarker(p);
  });
  for (const id of [...pins.keys()]) if (!seen.has(id)) { pins.delete(id); const m = markers.get(id); if (m) m.remove(); markers.delete(id); }
  const n = pins.size;
  const pend = snap.metadata.hasPendingWrites, off = snap.metadata.fromCache;
  const kn = curKarte && curKarte.name ? curKarte.name.slice(0, 18) + ' · ' : '';
  setStatus(`${kn}${n} ${n === 1 ? 'Spot' : 'Spots'}${off ? ' · offline' : pend ? ' · speichert…' : ''}`, off || pend ? 'off' : 'ok');
  if (firstSnap) { firstSnap = false; if (n && (!hadView || fitNext)) fitAll(); fitNext = false; if (SUG.show) setTimeout(() => loadSuggestions(false), 800); }
  if (mode === 'profile' && openId) {
    if (!pins.has(openId)) { closeSheet(); toast('Dieser Spot wurde gelöscht'); }
    else if (snap.docChanges({ includeMetadataChanges: false }).some(c => c.doc.id === openId)) { const y = $('#sheet').scrollTop; showProfile(openId, true); $('#sheet').scrollTop = y; }
  }
  if (mode === 'list') refreshList();
}

const PUB = { on: !!LS.get('spots.pub', false), unsub: null, orte: new Map(), markers: new Map(), prof: new Map(), first: true, fails: 0 };

const fmtR = v => (Math.round((Number(v) || 0) * 10) / 10).toLocaleString('de-DE');
const num10 = v => Math.max(0, Math.min(10, Number(v) || 0));
function ortAus(id, x) {

  const r = x.r || {};
  return { id, lat: x.lat, lng: x.lng, name: String(x.name || 'Ohne Namen').slice(0, 80), address: String(x.address || '').slice(0, 200), n: Math.max(0, Number(x.n) || 0), r: { g: num10(r.g), a: num10(r.a), u: num10(r.u) } };
}
function pubIcon(o) { return L.divIcon({ className: 'pin', html: `<div class="pub-b">${o.r.g ? fmtR(o.r.g) : ico('globe')}</div>`, iconSize: [38, 38], iconAnchor: [19, 19] }); }

function startPub() {

  const { F } = fs;
  PUB.unsub = F.onSnapshot(F.collection(fs.db, 'orte'), snap => {
    PUB.fails = 0;
    const seen = new Set();
    snap.forEach(d => {
      const o = ortAus(d.id, d.data()); if (!o) return;
      seen.add(o.id); PUB.orte.set(o.id, o);
      let m = PUB.markers.get(o.id); const sg = o.r.g + '|' + o.n + '|' + o.name;
      if (!m) { m = L.marker([o.lat, o.lng], { icon: pubIcon(o), title: o.name, zIndexOffset: -500 }).addTo(map); m.on('click', () => showOrt(m._oid)); m._oid = o.id; PUB.markers.set(o.id, m); }
      else { m.setLatLng([o.lat, o.lng]); if (m._sig !== sg) m.setIcon(pubIcon(o)); }
      m._sig = sg;
    });
    for (const id of [...PUB.orte.keys()]) if (!seen.has(id)) { PUB.orte.delete(id); const m = PUB.markers.get(id); if (m) m.remove(); PUB.markers.delete(id); }
    if (PUB.first && !snap.metadata.fromCache) { PUB.first = false; if (!PUB.orte.size) toast('Noch keine öffentlichen Spots. Teile einen über „Bearbeiten“.', 4000); }

}

  const when = fmtDate(e.updatedAt) || fmtDate(e.createdAt);
  return `<div class="rev"><div class="rev-h"><button class="who" data-act="nutzer-open" data-id="${esc(e.uid)}">${pAv(p, 'xs')}<span>${esc(p.kurz)}${mine ? ' (du)' : ''}<small>${esc(when)}</small></span></button>${stars('g', e.r.g)}</div>
    ${ortName !== undefined ? `<button class="linkbtn" data-act="ort-open" data-id="${esc(e.ort)}" style="padding:2px 0;min-height:36px">${esc(ortName || e.name)}</button>` : (e.name ? `<b class="rev-t">${esc(e.name)}</b>` : '')}
    <p class="small mut rev-r">Gesamt ${e.r.g}/10 · Ambiente ${e.r.a}/10 · Ungestört ${e.r.u}/10</p>
    ${e.desc ? `<p class="desc" style="margin:6px 0">${esc(e.desc)}</p>` : ''}
    ${mine ? '' : `<button class="linkbtn rev-m" data-act="melden" data-ort="${esc(e.ort)}" data-eid="${esc(e.id)}">${ico('flag')} Melden</button>`}</div>`;
}
async function showOrt(oid, keepView) {
  if (!fs) return;
  const o = await ortHolen(oid);
  if (!o) { toast('Dieser Ort ist nicht mehr öffentlich'); return; }
  if (!keepView) panAbove([o.lat, o.lng]);
  open(`<div class="head"><span class="av pubav">${ico('globe')}</span><div><h2>${esc(o.name)}</h2><p class="addr">${esc(o.address || 'Keine Adresse')}</p></div></div>
    <div class="score"><b>${o.r.g ? fmtR(o.r.g) : '–'}</b><div>${stars('g', Math.round(o.r.g))}<small>Durchschnitt aus ${o.n} ${o.n === 1 ? 'Bewertung' : 'Bewertungen'}</small></div></div>
    ${CATS.slice(1).map(([k, l]) => `<div class="rate"><span>${l}</span><span class="r">${stars(k, Math.round(o.r[k]))}<span class="n">${o.r[k] ? fmtR(o.r[k]) : '–'}</span></span></div>`).join('')}
    ${navHtml(o.lat, o.lng, o.name)}
    <h3>Bewertungen</h3><div id="revs"><p class="hint">Lade…</p></div>
    <button class="linkbtn rev-m ort-m" data-act="melden" data-ort="${esc(o.id)}" data-eid="" style="margin-top:8px">${ico('flag')} Ort melden</button>`, 'ort');
  openId = oid;
  try {
    const { F } = fs;
    const s = await F.getDocs(F.query(F.collection(fs.db, 'oeffentlich'), F.where('ort', '==', oid)));
    const list = s.docs.map(eintragAus).sort((a, b) => msOf(b.updatedAt) - msOf(a.updatedAt));
    const html = (await Promise.all(list.map(e => revHtml(e)))).join('');
    if (mode === 'ort' && openId === oid) { const el = $('#revs'); if (el) el.innerHTML = html || '<p class="hint">Noch keine Bewertungen.</p>'; }
  } catch (e) { const el = $('#revs'); if (el && mode === 'ort' && openId === oid) el.innerHTML = `<p class="hint">Bewertungen konnten nicht geladen werden: ${esc(errHint(e))}</p>`; }
}
async function showNutzer(uid) {
  if (!fs || !uid) return;
  const p = await profil(uid);
  open(`<div class="head">${pAv(p, '')}<div><h2>${esc(p.kurz)}${uid === me.uid ? ' (du)' : ''}</h2><p class="addr">Öffentliche Bewertungen</p></div></div>
    <div id="revs"><p class="hint">Lade…</p></div>`, 'nutzer');
  openId = uid;
  try {
    const { F } = fs;
    const s = await F.getDocs(F.query(F.collection(fs.db, 'oeffentlich'), F.where('uid', '==', uid)));
    const list = s.docs.map(eintragAus).sort((a, b) => msOf(b.updatedAt) - msOf(a.updatedAt));
    const orte = await Promise.all(list.map(e => ortHolen(e.ort)));
    const html = (await Promise.all(list.map((e, i) => revHtml(e, orte[i] ? orte[i].name : '')))).join('');
    if (mode === 'nutzer' && openId === uid) { const el = $('#revs'); if (el) el.innerHTML = html || '<p class="hint">Keine öffentlichen Bewertungen.</p>'; }
  } catch (e) { const el = $('#revs'); if (el && mode === 'nutzer' && openId === uid) el.innerHTML = `<p class="hint">Konnte nicht geladen werden: ${esc(errHint(e))}</p>`; }
}
const GRUENDE = [['person', 'Erkennbare Person oder Kennzeichen'], ['privat', 'Privatgrundstück oder Wohnadresse'], ['illegal', 'Gefährlich oder verboten'], ['beleidigend', 'Beleidigend oder unangemessen'], ['falsch', 'Falsch oder gibt es nicht mehr'], ['sonstiges', 'Etwas anderes']];
function showMelden(oid, eid) {
  if (!oid) return;
  open(`<form id="meldForm" class="form" data-ort="${esc(oid)}" data-eid="${esc(eid || '')}"><h2>${eid ? 'Bewertung melden' : 'Ort melden'}</h2>
    <p class="mut">Was stimmt nicht? Jede Meldung wird geprüft. Wer gemeldet wurde, erfährt nicht, von wem.</p>
    ${GRUENDE.map(([k, l]) => `<label class="chk"><input type="radio" name="grund" value="${k}"><span>${esc(l)}</span></label>`).join('')}
    <label>Details (freiwillig)<textarea id="mText" maxlength="500" placeholder="Was genau ist das Problem?"></textarea></label>
    <div class="row-btns"><button type="button" class="btn" data-act="melden-back" data-id="${esc(oid)}">Abbrechen</button><button type="submit" class="btn primary">Melden</button></div></form>`, 'melden');
}
async function sendMeldung(form) {
  const g = form.querySelector('input[name=grund]:checked');
  if (!g) { toast('Bitte wähle einen Grund'); return; }
  const { F } = fs;
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    await F.addDoc(F.collection(fs.db, 'meldungen'), { ort: form.dataset.ort, eintrag: form.dataset.eid || null, grund: g.value, text: ($('#mText').value || '').trim().slice(0, 500), by: me.uid, createdAt: F.serverTimestamp(), status: 'offen' });
    closeSheet(); toast('Danke – die Meldung wird geprüft', 3500);
  } catch (e) { if (btn) btn.disabled = false; toast('Melden fehlgeschlagen: ' + errHint(e), 6000); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const sm = $('#sortMenu');
  if (sm && sm.classList.contains('on') && !e.target.closest('#sortMenu') && !e.target.closest('#sortBtn')) sm.classList.remove('on');
  const st = e.target.closest('[data-star]');
  if (st && draft) { const k = st.dataset.star, v = +st.dataset.v; draft.r[k] = draft.r[k] === v ? 0 : v; renderStars(k); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'close') closeSheet();
  else if (a === 'add') { if (curKid && unsub) showAdd(); else showOnboard(); }
  else if (a === 'add-search') showSearch();
  else if (a === 'add-here') {
    toast('Standort wird ermittelt…');
    locate().then(ll => { showMe(ll); map.setView(ll, 17); newDraft(ll[0], ll[1]); }).catch(er => toast(er.message, 5000));
  }
  else if (a === 'add-pick') { closeSheet(); startPlacing((lat, lng) => newDraft(lat, lng)); }
  else if (a === 'place-ok') endPlacing(true);
  else if (a === 'place-cancel') endPlacing(false);
  else if (a === 'res') {
    const r = results[+b.dataset.i]; if (!r) return;
    const lat = +r.lat, lng = +r.lon;
    map.setView([lat, lng], 17); newDraft(lat, lng, fmtAddr(r));
  }
  else if (a === 'me') locate().then(ll => { showMe(ll); map.flyTo(ll, Math.max(map.getZoom(), 15)); }).catch(er => toast(er.message, 5000));
  else if (a === 'fit') fitAll();
  else if (a === 'list') showList();
  else if (a === 'open') { const p = pins.get(b.dataset.id); if (p) { map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15)); showProfile(p.id); } }
  else if (a === 'fav') toggleFav(b.dataset.id);
  else if (a === 'sort-menu') { const m = $('#sortMenu'); if (m) m.classList.toggle('on'); }
  else if (a === 'sort') toggleSort(b.dataset.k);
  else if (a === 'sort-reset') { sortSel = []; LS.set('spots.sort', sortSel); renderSortUi(false); }
  else if (a === 'more') { listLimit += LIST_STEP; const el = $('#lres'); if (el) el.innerHTML = listBodyHtml(); }
  else if (a === 'sug') { const s = SUG.items[+b.dataset.i]; if (s) { map.setView([s.lat, s.lng], Math.max(map.getZoom(), 15)); showSug(+b.dataset.i); } }
  else if (a === 'sug-here') loadSuggestions(true, true);
  else if (a === 'sug-reload') loadSuggestions(true);
  else if (a === 'sug-save') { const s = SUG.items[+b.dataset.i]; if (s) { newDraft(s.lat, s.lng, s.addr || ''); draft.name = s.t === 'park' && s.name === SUG_T.park.label ? 'Waldparkplatz' : s.name; showForm(); } }
  else if (a === 'route') showRoute(+b.dataset.lat, +b.dataset.lng, b.dataset.m);
  else if (a === 'route-clear') clearRoute();
  else if (a === 'settings') showSettings();
  else if (a === 'pub') togglePub();
  else if (a === 'ort-open') showOrt(b.dataset.id);
  else if (a === 'nutzer-open') showNutzer(b.dataset.id);
  else if (a === 'melden') showMelden(b.dataset.ort, b.dataset.eid);
  else if (a === 'melden-back') showOrt(b.dataset.id, true);
  else if (a === 'style') { setStyle(b.dataset.v); showSettings(); }
  else if (a === 'logout') confirmBox('Abmelden?', 'Die Spots bleiben gespeichert. Zum erneuten Anmelden brauchst du E-Mail und Passwort.', 'Abmelden', 'logout-yes');
  else if (a === 'logout-yes') { closeSheet(); if (fs) fs.Au.signOut(fs.auth); }
  else if (a === 'checkupdate') { toast('Suche nach Updates…'); checkUpdate(true); }
  else if (a === 'setup-mode') setupMode(b.dataset.m);
  else if (a === 'setup-logout') { if (fs) fs.Au.signOut(fs.auth); }
  else if (a === 'prof-edit') { pdraft = null; showProfileForm(false); }
  else if (a === 'prof-cancel') closeSheet();
  else if (a === 'prof-rmphoto') { syncPDraft(); pdraft.photo = ''; showProfileForm(); }
  else if (a === 'acc-del') confirmBox('Konto löschen?', 'Dein Profil und dein Login werden gelöscht. Spots auf gemeinsamen Karten bleiben für die anderen erhalten. Das lässt sich nicht rückgängig machen.', 'Weiter', 'acc-del-pw');
  else if (a === 'acc-del-pw') showDeleteForm();
  else if (a === 'karten') showKarten();
  else if (a === 'karte-open') { closeSheet(); switchKarte(b.dataset.id); }
  else if (a === 'karte-manage') { if (b.dataset.id !== curKid) switchKarte(b.dataset.id, true); showKarte(); }
  else if (a === 'link-new') newLink();
  else if (a === 'link-share') shareLink(b.dataset.c);
  else if (a === 'link-del') delLink(b.dataset.c);
  else if (a === 'mem-del') { pendingMem = b.dataset.id; confirmBox('Mitglied entfernen?', 'Die Person sieht die Karte danach nicht mehr. Ihre Spots bleiben auf der Karte.', 'Entfernen', 'mem-del-yes'); }
  else if (a === 'mem-del-yes') removeMember(pendingMem);
  else if (a === 'karte-leave') confirmBox('Karte verlassen?', 'Du siehst die Karte und ihre Spots danach nicht mehr. Zurück kommst du nur mit einem neuen Code.', 'Verlassen', 'karte-leave-yes');
  else if (a === 'karte-leave-yes') leaveKarte();
  else if (a === 'karte-del') confirmBox('Karte löschen?', 'Die Karte und alle ihre Spots werden für alle Mitglieder gelöscht. Das lässt sich nicht rückgängig machen.', 'Endgültig löschen', 'karte-del-yes');
  else if (a === 'karte-del-yes') deleteKarte();
  else if (a === 'edit') {
    const p = pins.get(openId); if (!p) return;
    const id = openId;
    open('', 'form'); openId = null;
    draft = { id, name: p.name, desc: p.desc, address: p.address, autoAddr: '', lat: p.lat, lng: p.lng, photo: p.photo, r: { g: clampR(p.r.g), a: clampR(p.r.a), u: clampR(p.r.u) }, pub: !!p.pub, pubBy: p.pub || '' };
    showForm();
  }
  else if (a === 'del') { const p = pins.get(openId); if (p) confirmBox(`„${p.name}“ löschen?`, 'Der Spot verschwindet auf allen verbundenen Handys. Das lässt sich nicht rückgängig machen.', 'Löschen', 'del-yes', p.id); }
  else if (a === 'del-yes') deletePin(b.dataset.id);
  else if (a === 'back') { if (pins.has(b.dataset.id)) showProfile(b.dataset.id, true); else closeSheet(); }
  else if (a === 'cancel') { const id = draft && draft.id; draft = null; if (id && pins.has(id)) showProfile(id, true); else closeSheet(); }
  else if (a === 'rmphoto') { syncDraft(); draft.photo = ''; showForm(); }
  else if (a === 'readdr') { syncDraft(); const f = $('#fAddr'); f.value = ''; f.dataset.auto = '1'; draft.address = ''; autoAddress(); }
  else if (a === 'move') {
    syncDraft(); const d = draft;
    startPlacing((lat, lng) => {
      draft = d; d.lat = lat; d.lng = lng;
      const wasAuto = !d.address || d.address === d.autoAddr;
      if (wasAuto) d.address = '';
      showForm();
      if (!wasAuto) toast('Position geändert – Adresse ggf. mit ↻ neu ermitteln', 4000);
    }, () => { draft = d; showForm(); }, [d.lat, d.lng]);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pf') savePin();
  else if (e.target.id === 'sf') doSearch();
  else if (e.target.id === 'setupForm') submitSetup();
  else if (e.target.id === 'profForm') saveProfile();
  else if (e.target.id === 'delForm') deleteAccount();
  else if (e.target.id === 'newKarteForm') createKarte($('#nkName').value);
  else if (e.target.id === 'joinForm') joinWithCode($('#jCode').value);
  else if (e.target.id === 'renameForm') renameKarte($('#rkName').value);
  else if (e.target.id === 'meldForm') sendMeldung(e.target);
});
document.addEventListener('change', async e => {
  if (e.target.id === 'sugTog') {
    SUG.show = e.target.checked; LS.set('spots.sugShow', SUG.show);
    if (SUG.show && !SUG.items.length) loadSuggestions(true); else drawSugMarkers();
    toast(SUG.show ? 'Vorschläge auf der Karte eingeblendet' : 'Vorschläge ausgeblendet');
    return;
  }
  if (e.target.id === 'profPhotoIn' && pdraft) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { syncPDraft(); pdraft.photo = await toThumb(f); showProfileForm(); } catch (er) { toast(er.message); }
    return;
  }
  if (e.target.id !== 'photoIn' || !draft) return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { syncDraft(); draft.photo = await toThumb(f); showForm(); } catch (er) { toast(er.message); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'lq') {
    listQuery = e.target.value; listLimit = LIST_STEP;
    const el = $('#lres'); if (el) el.innerHTML = listBodyHtml();
  } else if (e.target.id === 'fAddr') e.target.dataset.auto = '0';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (placing) endPlacing(false); else closeSheet(); } });

/* ---------- Start ---------- */
for (const el of document.querySelectorAll('[data-ic]')) el.innerHTML = ico(el.dataset.ic);
if (typeof L === 'undefined') {
  document.body.innerHTML = '<p style="padding:40px 24px;font:17px/1.5 system-ui">Die Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen und die App neu öffnen.</p>';
} else {
  fitScreen();
  setupMode('login');
  initMap();
  connect();
  setTimeout(() => checkUpdate(false), 2500);
  setInterval(() => checkUpdate(false), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(false); if (fs && fs.auth.currentUser && me.uid && !kartenUnsub) listenKarten(fs.auth.currentUser); if (fs && fs.auth.currentUser && me.uid) startPub(); } });
}
}
</script>
</body>
